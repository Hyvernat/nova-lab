[defaults]
inventory = /vagrant/ansible/inventories/hosts.yml
roles_path = /vagrant/ansible/roles
vault_identity_list = preprod@/home/vagrant/.vault/preprod, prod@/home/vagrant/.vault/prod
remote_user = vagrant
private_key_file = /home/vagrant/.ssh/id_ed25519
host_key_checking = False          ; laboratoire uniquement
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml      ; sorties lisibles
nocows = True

[ssh_connection]
pipelining = True                  ; moins d'allers-retours SSH
ssh_args = -o ControlMaster=auto -o ControlPersist=60s