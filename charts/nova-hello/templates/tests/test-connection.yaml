apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nova-hello.fullname" . }}-test"
  labels:
    {{- include "nova-hello.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
      - |
          for i in 1 2 3 4 5 6; do
            wget -qO- http://{{ include "nova-hello.fullname" . }}:{{ .Values.service.port }}/ \
              | grep -q "{{ .Values.app.environment }}" && exit 0
            echo "tentative $i : pas encore joignable, nouvel essai dans 5 s"
            sleep 5
          done
          exit 1